[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidproof-crypto"
version = "0.1.0"
description = "VidProof shared cryptographic primitives (Ed25519, AES-256-GCM, X25519 key wrapping)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[tool.setuptools.packages.find]
include = ["vidproof_crypto*"]
